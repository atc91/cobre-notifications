# Local development profile: activate with -Dspring.profiles.active=local
# Hardcoded, developer-friendly overrides only. No secrets.
# R2DBC defaults in application.yml already point at the docker-compose notifications-db.
logging:
  level:
    com.cobre.notifications: DEBUG
    # Surface R2DBC connections and SQL for local debugging.
    org.springframework.r2dbc: DEBUG
    io.r2dbc.postgresql.QUERY: DEBUG
