spring:
  application:
    name: cobre-notifications
  # Production connectivity is R2DBC only. Flyway is test-scope (see src/test/resources).
  r2dbc:
    url: ${SPRING_R2DBC_URL:r2dbc:postgresql://localhost:5432/notifications}
    username: ${POSTGRES_USER:notifications}
    password: ${POSTGRES_PASSWORD:notifications}

# JSON seed loader (P-04): on startup, ingest notification_events.json as PENDING notifications.
# Idempotent, so restarts are safe. Disable via env in environments fed by Kafka (P-14).
# Subscription seed loader (P-05): on startup, register subscriptions.json rows; runs before the
# event loader so ingest can resolve each event against a subscription (the delivery gate).
notifications:
  seed:
    enabled: ${NOTIFICATIONS_SEED_ENABLED:true}
    location: ${NOTIFICATIONS_SEED_LOCATION:classpath:notification_events.json}
  subscription-seed:
    enabled: ${NOTIFICATIONS_SUBSCRIPTION_SEED_ENABLED:true}
    location: ${NOTIFICATIONS_SUBSCRIPTION_SEED_LOCATION:classpath:subscriptions.json}

server:
  port: 8080

# Actuator: expose only health (and info) in this phase.
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
