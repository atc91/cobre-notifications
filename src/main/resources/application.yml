spring:
  application:
    name: cobre-notifications
  # Production connectivity is R2DBC only. Flyway is test-scope (see src/test/resources).
  r2dbc:
    url: ${SPRING_R2DBC_URL:r2dbc:postgresql://localhost:5432/notifications}
    username: ${POSTGRES_USER:notifications}
    password: ${POSTGRES_PASSWORD:notifications}

# JSON seed loader (P-04): on startup, ingest notification_events.json as PENDING notifications.
# Idempotent, so restarts are safe. Disable via env in environments fed by Kafka (P-14).
# Subscription seed loader (P-05): on startup, register subscriptions.json rows; runs before the
# event loader so ingest can resolve each event against a subscription (the delivery gate).
notifications:
  seed:
    enabled: ${NOTIFICATIONS_SEED_ENABLED:true}
    location: ${NOTIFICATIONS_SEED_LOCATION:classpath:notification_events.json}
  subscription-seed:
    enabled: ${NOTIFICATIONS_SUBSCRIPTION_SEED_ENABLED:true}
    location: ${NOTIFICATIONS_SUBSCRIPTION_SEED_LOCATION:classpath:subscriptions.json}
  # Webhook client (P-06): SSRF guard strict by default; strict https-only + private/loopback/metadata
  # blocking. Timeouts bound each outbound call.
  webhook:
    block-private-networks: ${NOTIFICATIONS_WEBHOOK_BLOCK_PRIVATE_NETWORKS:true}
    connect-timeout-ms: ${NOTIFICATIONS_WEBHOOK_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${NOTIFICATIONS_WEBHOOK_READ_TIMEOUT_MS:5000}
  # Delivery worker (P-07): the scheduler polls for due rows and delivers them in batches.
  delivery:
    scheduler-enabled: ${NOTIFICATIONS_DELIVERY_SCHEDULER_ENABLED:true}
    poll-interval-ms: ${NOTIFICATIONS_DELIVERY_POLL_INTERVAL_MS:5000}
    batch-size: ${NOTIFICATIONS_DELIVERY_BATCH_SIZE:100}
  # Retry policy (P-08, assumption A4): exponential back-off + jitter, capped, then dead-letter.
  retry:
    max-attempts: ${NOTIFICATIONS_RETRY_MAX_ATTEMPTS:5}
    base-delay-ms: ${NOTIFICATIONS_RETRY_BASE_DELAY_MS:30000}
    factor: ${NOTIFICATIONS_RETRY_FACTOR:2}
    cap-ms: ${NOTIFICATIONS_RETRY_CAP_MS:3600000}

server:
  port: 8080

# Actuator: expose only health (and info) in this phase.
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
