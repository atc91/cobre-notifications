# Test profile: Flyway applies the schema (via JDBC) to the Testcontainers Postgres
# before the R2DBC-based tests run. Connection details come from @ServiceConnection.
spring:
  flyway:
    locations: filesystem:src/main/flyway

# Do not auto-seed in @SpringBootTest contexts; the seed-loader ITs opt back in explicitly.
notifications:
  seed:
    enabled: false
  subscription-seed:
    enabled: false
  # Reach the loopback stub server in adapter/pipeline ITs (production keeps the guard strict).
  webhook:
    block-private-networks: false
  # Do not auto-run the delivery poller in @SpringBootTest contexts; ITs drive deliverDue() directly.
  delivery:
    scheduler-enabled: false
